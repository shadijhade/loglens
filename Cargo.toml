[package]
name = "loglens"
version = "0.1.0"
edition = "2024"
description = "Desktop viewer and analyzer for Serilog text logs"
repository = "https://github.com/shadijhade/loglens"
license = "MIT"
publish = false

[dependencies]
gpui-kit = "0.10.0"
# Already in gpui-kit's tree, so these cost no extra build time.
regex = "1"
memchr = "2"
chrono = { version = "0.4", default-features = false }
serde_json = "1"
ar-reshaper = "1.5"
unicode-bidi = "0.3"

[dev-dependencies]
resvg = "0.45" # examples/make_icon.rs; already in the tree through gpui-kit

[build-dependencies]
embed-resource = "3" # the crate GPUI itself uses for its manifest

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
