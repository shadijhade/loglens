<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>LogLens</title>
  <!-- Idea: a lens over log lines that picks out the one line that matters. -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="#141922"/>
  <rect x="10" y="10" width="236" height="236" rx="52" fill="none" stroke="#2B3545" stroke-width="4"/>
  <!-- log lines -->
  <g fill="#566275">
    <rect x="44" y="55" width="140" height="18" rx="9"/>
    <rect x="44" y="103" width="168" height="18" rx="9"/>
    <rect x="44" y="151" width="120" height="18" rx="9"/>
    <rect x="44" y="199" width="84" height="18" rx="9"/>
  </g>
  <!-- lens: halo, glass, ring, handle -->
  <circle cx="160" cy="142" r="68" fill="#141922"/>
  <path d="M200 182 L220 202" stroke="#E8EDF4" stroke-width="22" stroke-linecap="round"/>
  <circle cx="160" cy="142" r="48" fill="#1B2330" stroke="#E8EDF4" stroke-width="20"/>
  <!-- what the lens shows -->
  <rect x="136" y="116" width="40" height="16" rx="8" fill="#AEB9C8"/>
  <rect x="130" y="144" width="60" height="20" rx="10" fill="#FF6B5E"/>
</svg>
